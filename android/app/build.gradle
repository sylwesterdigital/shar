plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def releaseStore = System.getenv('SHAR_ANDROID_KEYSTORE')
def releaseAlias = System.getenv('SHAR_ANDROID_KEY_ALIAS') ?: 'shar'
def releaseStorePassword = System.getenv('SHAR_ANDROID_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('SHAR_ANDROID_KEY_PASSWORD') ?: releaseStorePassword

android {
    namespace 'com.localwebshare.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.localwebshare.app'
        minSdk 26
        targetSdk 35
        versionCode 20645
        versionName '2.2.445'
    }

    signingConfigs {
        release {
            if (releaseStore && releaseStorePassword) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ggml-base.bin is ~148 MB and is already a binary model. Asking AAPT2 to
    // deflate it wastes a large amount of Gradle heap and can fail in
    // compressReleaseAssets. Store .bin assets verbatim instead.
    androidResources {
        noCompress += ['bin']
    }
}


dependencies {
    implementation 'dev.ffmpegkit-maintained:whisper-android:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
