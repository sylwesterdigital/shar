plugins { id 'com.android.application' }

def releaseStore = System.getenv('SHAR_ANDROID_KEYSTORE')
def releaseAlias = System.getenv('SHAR_ANDROID_KEY_ALIAS') ?: 'shar'
def releaseStorePassword = System.getenv('SHAR_ANDROID_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('SHAR_ANDROID_KEY_PASSWORD') ?: releaseStorePassword

android {
    namespace 'com.localwebshare.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.localwebshare.app'
        minSdk 26
        targetSdk 35
        versionCode 20109
        versionName '2.1.9'
    }

    signingConfigs {
        release {
            if (releaseStore && releaseStorePassword) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
