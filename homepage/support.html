<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support Shar</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1320;color:#f4f7fb}.card{width:min(560px,calc(100% - 40px));padding:32px;border:1px solid #2d3748;border-radius:22px;background:#151d2b;box-sizing:border-box}h1{margin:0 0 10px}p{color:#b9c2d2;line-height:1.5}.btn{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:12px;background:#3487f6;color:white;text-decoration:none;font-weight:700}.muted{font-size:13px;color:#8792a5}</style>
</head>
<body>
<main class="card">
  <h1>Support Shar</h1>
  <p id="message">Opening the secure Stripe payment page…</p>
  <a id="support" class="btn" href="__STRIPE_SUPPORT_HREF__">Continue to Stripe</a>
  <p class="muted">Payments are handled by Stripe. Shar does not receive or store your card details.</p>
</main>
<script>
(() => {
  const url = __STRIPE_SUPPORT_JSON__;
  const button = document.getElementById('support');
  const message = document.getElementById('message');
  if (!url || url.startsWith('__')) {
    button.hidden = true;
    message.textContent = 'The Stripe support link has not been configured on this deployment yet.';
    return;
  }
  button.href = url;
  setTimeout(() => location.replace(url), 180);
})();
</script>
</body>
</html>
